<div class="auth-page">
    <div class="card auth-card p-4">
        <h2 class="text-center fw-bold mb-1">Bienvenido</h2>
        <p class="text-center text-muted mb-4">Inicia sesión para ver tus tareas</p>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" class="form-control" formControlName="email" placeholder="tu@correo.com"
                    [class.is-invalid]="invalid('email')" />
                <div class="invalid-feedback">Ingresa un correo válido</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input id="password" type="password" class="form-control" formControlName="password"
                    placeholder="Mínimo 6 caracteres" [class.is-invalid]="invalid('password')" />
                <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres</div>
            </div>

            @if (error()) {
            <div class="alert alert-danger py-2">{{ error() }}</div>
            }

            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
                @if (loading()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                }
                Login
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
        </p>
    </div>
</div>
