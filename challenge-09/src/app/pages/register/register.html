<div class="auth-page">
    <div class="card auth-card p-4">
        <h2 class="text-center fw-bold mb-1">Crear cuenta</h2>
        <p class="text-center text-muted mb-4">Regístrate para guardar tus tareas</p>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
                <label class="form-label" for="name">Nombre</label>
                <input id="name" type="text" class="form-control" formControlName="name"
                    [class.is-invalid]="invalid('name')" />
                <div class="invalid-feedback">Ingresa tu nombre</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" class="form-control" formControlName="email"
                    [class.is-invalid]="invalid('email')" />
                <div class="invalid-feedback">Ingresa un correo válido</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input id="password" type="password" class="form-control" formControlName="password"
                    [class.is-invalid]="invalid('password')" />
                <div class="invalid-feedback">Mínimo 6 caracteres</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirm">Confirmar contraseña</label>
                <input id="confirm" type="password" class="form-control" formControlName="confirm"
                    [class.is-invalid]="invalid('confirm') || mismatch()" />
                <div class="invalid-feedback">
                    {{ mismatch() ? 'Las contraseñas no coinciden' : 'Confirma tu contraseña' }}
                </div>
            </div>

            @if (error()) {
            <div class="alert alert-danger py-2">{{ error() }}</div>
            }

            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
                @if (loading()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                }
                Registrarme
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
    </div>
</div>
