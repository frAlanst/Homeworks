<h3>Lista de Estudiantes Registrados</h3>

@if (students.length === 0) {
  <p>No hay estudiantes en la lista.</p>
} @else {
  <ul>
    @for (student of students; track student.code) {
      <li style="margin-bottom: 8px;">
        <strong>Código:</strong> {{ student.code }} | 
        <strong>Nombre:</strong> {{ student.name }} | 
        <strong>Edad:</strong> {{ student.age }} años
        <button (click)="onDelete(student.code)" style="margin-left: 10px; color: red;">
          Eliminar
        </button>
      </li>
    }
  </ul>
}
