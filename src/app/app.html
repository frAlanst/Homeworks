<div style="padding: 20px; font-family: sans-serif; max-width: 500px;">
  <h2>Practice 01 - Registro de Estudiantes</h2>

 
  <div style="background-color: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
    <h3>Registrar Estudiante</h3>
    
    <div style="margin-bottom: 10px;">
      <label>Código:</label><br>
      <input type="text" [(ngModel)]="code" placeholder="Ej. A01" />
    </div>

    <div style="margin-bottom: 10px;">
      <label>Nombre:</label><br>
      <input type="text" [(ngModel)]="name" placeholder="Ej. Carlos" />
    </div>

    <div style="margin-bottom: 10px;">
      <label>Edad:</label><br>
      <input type="number" [(ngModel)]="age" placeholder="Ej. 20" />
    </div>

    <button (click)="addStudent()">Agregar a la Lista</button>
  </div>

  <hr />

  <app-student-list 
    [students]="studentArray" 
    (deleteStudent)="removeStudent($event)">
  </app-student-list>
</div>
