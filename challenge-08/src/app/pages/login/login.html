<div class="wrapper">
    <form class="card" (ngSubmit)="submit()">
        <h2>Iniciar sesión</h2>

        <label>
            Email
            <input type="email" name="email" [(ngModel)]="email" placeholder="user@mail.com" required />
        </label>

        <label>
            Password
            <input type="password" name="password" [(ngModel)]="password" placeholder="123" required />
        </label>

        @if (error()) {
        <p class="error">{{ error() }}</p>
        }

        <button type="submit">Login</button>
        <small>Demo: user@mail.com / 123</small>
    </form>
</div>
